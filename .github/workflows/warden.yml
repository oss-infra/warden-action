name: Warden self scan

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            repository:
                description: Public GitHub or Gitee repository URL
                required: true
                type: string
            branch:
                description: Branch to scan
                required: false
                default: main
                type: string

permissions:
    contents: read

jobs:
    scan:
        runs-on: ubuntu-latest
        steps:
            -
                name: Check out action
                uses: actions/checkout@v5

            -
                name: Run Warden scan
                id: warden
                uses: ./
                with:
                    token: ${{ secrets.YUANXI_TOKEN }}
                    repository: ${{ inputs.repository }}
                    branch: ${{ inputs.branch }}
                    scan_type: all
                    fail_on_severity: high

            -
                name: Save structured report
                if: always() && steps.warden.outputs.json != ''
                env:
                    WARDEN_REPORT: ${{ steps.warden.outputs.json }}
                run: |
                    printf '%s\n' "$WARDEN_REPORT" > warden-report.json

            -
                name: Upload structured report
                if: always() && steps.warden.outputs.json != ''
                uses: actions/upload-artifact@v6
                with:
                    name: warden-report
                    path: warden-report.json
