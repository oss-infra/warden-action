name: Pull request security and compliance

on:
    pull_request_target:
        types: [opened, synchronize, reopened, ready_for_review]

permissions:
    contents: read

concurrency:
    group: warden-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    scan:
        name: Warden security and compliance
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        steps:
            # Run only the trusted Action code from the target repository.
            - name: Check out trusted action
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  persist-credentials: false

            - name: Scan remote pull request branch
              id: warden
              uses: ./
              with:
                  token: ${{ secrets.YUANXI_TOKEN }}
                  repository: ${{ github.event.pull_request.head.repo.clone_url }}
                  branch: ${{ github.event.pull_request.head.ref }}
                  scan_type: all
                  fail_on_severity: high
                  fail_on_license_conflict: true
                  fail_on_license_risk: true

            - name: Save structured report
              if: always() && steps.warden.outputs.json != ''
              env:
                  WARDEN_REPORT: ${{ steps.warden.outputs.json }}
              run: printf '%s\n' "$WARDEN_REPORT" | jq '.' > warden-report.json

            - name: Upload structured report
              if: always() && steps.warden.outputs.json != ''
              uses: actions/upload-artifact@v6
              with:
                  name: warden-pr-${{ github.event.pull_request.number }}-report
                  path: warden-report.json
